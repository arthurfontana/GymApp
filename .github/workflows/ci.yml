# CI do GymApp (S03). O job `guardrails` (S01) é rápido e barato; o job `verificar` roda
# o mesmo que o Arthur rodaria na máquina: npm run check + e2e (Playwright, Chromium).
# O deploy (preview por PR e produção em main) é da integração Git da Vercel, fora deste arquivo.
name: CI

on:
  pull_request:
  push:

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Teto do CLAUDE.md (padrão 450 linhas, ou CLAUDE_MD_MAX_LINES)
      - name: Teto do CLAUDE.md
        run: npm run check:claude-md

  verificar:
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check:claude-md + testes unitários (vitest) + build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # build + e2e com assert (claro e escuro, 390×844)
      - run: npm run test:e2e
      # prints e relatório só quando algo falha
      - name: Anexar prints dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prints-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
