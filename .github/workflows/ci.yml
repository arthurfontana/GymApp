# CI do GymApp. A S01 criou o job `guardrails` (a S02 o trouxe para a raiz, junto com o
# package.json); a S03 amplia este workflow (install, testes, build e e2e).
name: CI

on:
  pull_request:
  push:

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Teto do CLAUDE.md (padrão 450 linhas, ou CLAUDE_MD_MAX_LINES)
      - name: Teto do CLAUDE.md
        run: npm run check:claude-md
